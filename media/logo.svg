    <stop stop-color="#1E293B"/>
    <stop offset="0.55" stop-color="#312E81"/>
    <stop offset="1" stop-color="#0F172A"/>
  </linearGradient>
  <linearGradient id="glass" x1="24" y1="74" x2="104" y2="104" gradientUnits="userSpaceOnUse">
    <stop stop-color="#FFFFFF" stop-opacity="0.26"/>
